name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only token: CI builds and tests, it never writes to the repository. Actions are pinned to commit SHAs (the tag
# in the comment is for people); bump them deliberately, never by tag. Restores are locked to packages.lock.json.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  publish-windows:
    runs-on: windows-latest
    needs: build-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/DeadlockScout.App -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DeadlockScout-win-x64
          path: publish
      # The installer builds on every push so a broken script shows here, not on release day.
      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1 -Publish publish -Out installer-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DeadlockScout-Setup
          path: installer-out/*.exe
