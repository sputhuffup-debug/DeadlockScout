name: Screenshots

# Renders the README screenshots on a Windows runner (WPF only runs on Windows) and commits them to the branch.
# Runs on pushes to non-main branches that touch the app, or by hand from the Actions tab.
# Pushes made with GITHUB_TOKEN do not start new workflow runs, so the commit cannot loop.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "src/DeadlockScout.App/**"
      - ".github/workflows/screenshots.yml"

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    # Dependabot's runs get a read-only token, so the commit step could only fail there; its bumps change no pixels.
    if: github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write # commit the rendered images back to this branch, nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/DeadlockScout.App -c Release
      - name: Render screenshots
        run: dotnet run --project src/DeadlockScout.App -c Release --no-build -- --screenshots "${{ github.workspace }}\docs\screenshots"
      - name: Commit screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "Screenshots unchanged"; exit 0; fi
          git commit -m "Update app screenshots"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
